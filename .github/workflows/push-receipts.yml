name: Process Expo push receipts

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: curit-push-receipts
  cancel-in-progress: false

jobs:
  process-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process pending Expo receipts
        env:
          CURIT_OPERATIONS_JOB_SECRET: ${{ secrets.CURIT_OPERATIONS_JOB_SECRET }}
        run: |
          test -n "$CURIT_OPERATIONS_JOB_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-curit-job-secret: $CURIT_OPERATIONS_JOB_SECRET" \
            --header "content-type: application/json" \
            --data '{}' \
            https://gmfjejxtqkuviwbxpgrw.supabase.co/functions/v1/commerce/api/internal/push/receipts
