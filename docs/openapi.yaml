openapi: 3.1.0
info:
  title: CURI:T QR Commerce API
  version: 0.2.0
  description: QR 방문객 구매와 인증 사용자용 상품·수령 관리 API
servers:
  - url: http://localhost:4100
    description: Fastify 로컬 서버
  - url: https://gmfjejxtqkuviwbxpgrw.supabase.co/functions/v1/commerce
    description: Supabase Edge Function
paths:
  /health:
    get:
      summary: 서버 상태 확인
      responses:
        "200":
          description: 정상
  /api/v1/qr/{token}:
    get:
      summary: 상품별 QR 토큰으로 전시 상품 조회
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 12, maxLength: 128 }
        - in: header
          name: x-curit-visitor-id
          required: false
          description: 브라우저가 생성한 익명 식별자. 서버에서 해시한 뒤 상품별 일간 순방문 집계에만 사용합니다.
          schema: { type: string, minLength: 16, maxLength: 128 }
      responses:
        "200":
          description: 매장·작가·상품·재고 snapshot
        "404":
          description: 존재하지 않거나 폐기된 QR
  /api/auth/session:
    get:
      summary: 주문 조회용 연락처 세션 확인
      responses:
        "200": { description: 세션 상태 }
  /api/auth/identity/start:
    post:
      summary: 프로토타입 연락처 세션 시작
      description: 현재는 통신사 본인인증이 아니며 운영 전 별도 사업자 연동 여부를 결정해야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, consent]
              properties:
                phone: { type: string, pattern: "^01[016789]\\d{7,8}$" }
                consent: { type: boolean, const: true }
                remember: { type: boolean }
      responses:
        "200": { description: 서명된 HttpOnly 쿠키 발급 }
  /api/checkout:
    post:
      summary: 서버 가격과 재고로 주문 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken, quantity, name, paymentMethod]
              properties:
                qrToken: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 20 }
                name: { type: string, minLength: 1, maxLength: 40 }
                paymentMethod: { type: string, enum: [card, kakaopay, tosspay] }
      responses:
        "200": { description: 결제 요청용 주문과 성공·실패 URL }
        "401": { description: 연락처 세션 없음 }
        "409": { description: 판매 전 또는 재고 부족 }
  /api/payments/confirm:
    post:
      summary: 토스페이먼츠 승인 후 주문·재고·정산 원장 확정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentKey, orderId, amount]
              properties:
                paymentKey: { type: string }
                orderId: { type: string }
                amount: { type: integer, minimum: 1 }
      responses:
        "200": { description: 결제 완료 주문과 정산 결과 }
        "400": { description: 결제 금액 또는 승인 정보 불일치 }
        "409": { description: 재고 부족 또는 이미 처리된 주문 }
  /api/orders:
    get:
      summary: 현재 연락처 세션의 주문 목록
      responses:
        "200": { description: 주문 목록 }
        "401": { description: 연락처 세션 없음 }
  /api/orders/{id}:
    get:
      summary: 현재 연락처 세션의 주문 상세
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 주문 상세 }
        "401": { description: 연락처 세션 없음 }
        "404": { description: 주문 없음 }
  /api/management/listings:
    get:
      summary: 참여 중인 협업의 QR 상품과 발급 후보 조회
      security: [{ supabaseBearer: [] }]
      responses:
        "200": { description: 발급된 QR 상품과 발급 가능 후보 }
        "401": { description: 유효한 Supabase 세션 없음 }
    post:
      summary: 승인된 협업 상품에 고유 QR 발급
      security: [{ supabaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaborationId, projectItemId]
              properties:
                collaborationId: { type: string, format: uuid }
                projectItemId: { type: string, format: uuid }
      responses:
        "201": { description: 새 QR 상품 발급 }
        "403": { description: 협업 참여자가 아니거나 발급 가능한 상태가 아님 }
  /api/management/listings/{id}:
    patch:
      summary: QR 상품 가격·재고·수령 방식·판매 상태 변경
      security: [{ supabaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price: { type: integer, minimum: 0 }
                stock: { type: integer, minimum: 0 }
                pickupMode: { type: string, enum: [immediate, exhibition] }
                saleStatus: { type: string, enum: [active, preparing] }
      responses:
        "200": { description: 수정된 QR 상품 }
        "403": { description: 협업 참여자가 아님 }
  /api/management/orders:
    get:
      summary: 매장의 결제 완료 주문과 수령 상태 조회
      security: [{ supabaseBearer: [] }]
      responses:
        "200": { description: 수령 대기·예약·전달 완료 주문 }
        "403": { description: 매장 계정이 아님 }
  /api/management/orders/{id}:
    patch:
      summary: 매장 직원이 주문 수령 상태 변경
      security: [{ supabaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfillmentStatus]
              properties:
                fulfillmentStatus: { type: string, enum: [awaiting_pickup, reserved, delivered] }
      responses:
        "200": { description: 변경된 수령 상태 }
        "403": { description: 해당 주문의 매장 운영자가 아님 }

components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
