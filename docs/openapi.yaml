openapi: 3.1.0
info:
  title: CURI:T QR Commerce API
  version: 0.1.0
  description: QR 방문객용 공개 상품 조회와 프로토타입 주문 API
servers:
  - url: http://localhost:4100
paths:
  /health:
    get:
      summary: 서버 상태 확인
      responses:
        "200":
          description: 정상
  /api/v1/qr/{token}:
    get:
      summary: 상품별 QR 토큰으로 전시 상품 조회
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200":
          description: 매장·작가·상품·재고 snapshot
        "404":
          description: 존재하지 않거나 폐기된 QR
  /api/auth/session:
    get:
      summary: 주문 조회용 연락처 세션 확인
      responses:
        "200": { description: 세션 상태 }
  /api/auth/identity/start:
    post:
      summary: 프로토타입 연락처 세션 시작
      description: 현재는 통신사 본인인증이 아니며 운영 전 별도 사업자 연동 여부를 결정해야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, consent]
              properties:
                phone: { type: string, pattern: "^01[016789]\\d{7,8}$" }
                consent: { type: boolean, const: true }
                remember: { type: boolean }
      responses:
        "200": { description: 서명된 HttpOnly 쿠키 발급 }
  /api/checkout:
    post:
      summary: 서버 가격과 재고로 주문 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken, quantity, name, paymentMethod]
              properties:
                qrToken: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 20 }
                name: { type: string, minLength: 1, maxLength: 40 }
                paymentMethod: { type: string, enum: [card, kakaopay, tosspay] }
      responses:
        "200": { description: 데모 주문 완료 URL }
        "401": { description: 연락처 세션 없음 }
        "409": { description: 판매 전 또는 재고 부족 }
  /api/orders:
    get:
      summary: 현재 연락처 세션의 주문 목록
      responses:
        "200": { description: 주문 목록 }
        "401": { description: 연락처 세션 없음 }
  /api/orders/{id}:
    get:
      summary: 현재 연락처 세션의 주문 상세
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 주문 상세 }
        "401": { description: 연락처 세션 없음 }
        "404": { description: 주문 없음 }
